<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micro Duck</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: system-ui, sans-serif;
}

.stage {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5vh;
}

.eyes {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(35px, 12vw, 150px);
  width: 100%;
}

.eye {
  width: clamp(65px, 19vw, 190px);
  height: clamp(110px, 32vh, 290px);
  background: #42baff;
  border-radius: 8px;
  box-shadow: 0 0 35px var(--eye-glow, #168bff88);
  animation: blink 6s infinite;
  transition: background .3s, box-shadow .3s;
}

.eye:nth-child(2) {
  animation-delay: .12s;
}

@keyframes blink {
  0%, 94%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(.08); }
}

.caption {
  min-height: 55px;
  font-size: clamp(20px, 4vw, 32px);
  color: var(--caption-color, #83d5ff);
  opacity: 0;
  transition: opacity .5s ease;
  text-align: center;
}

.caption.show {
  opacity: 1;
}

/* Menu button */

.menu-button {
  position: fixed;
  top: 22px;
  right: 22px;
  z-index: 5;
  width: 52px;
  height: 52px;
  border: 1px solid #333;
  border-radius: 14px;
  background: #111;
  color: white;
  font-size: 25px;
  cursor: pointer;
}

/* Menu backdrop */

.backdrop {
  position: fixed;
  inset: 0;
  background: #0009;
  opacity: 0;
  visibility: hidden;
  transition: opacity .35s, visibility .35s;
  z-index: 6;
}

.backdrop.open {
  opacity: 1;
  visibility: visible;
}

/* Side menu */

.menu {
  position: fixed;
  top: 0;
  right: 0;
  height: 100dvh;
  width: min(340px, 85vw);
  background: #101010;
  border-left: 1px solid #292929;
  z-index: 7;
  padding: 28px;
  transform: translateX(100%);
  transition: transform .4s cubic-bezier(.2,.8,.2,1);
  overflow-y: auto;
}

.menu.open {
  transform: translateX(0);
}

.menu-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.menu-header h2 {
  color: #66caff;
  letter-spacing: 2px;
  font-size: 19px;
}

.close {
  background: transparent;
  color: white;
  border: none;
  font-size: 26px;
  cursor: pointer;
}

.section {
  margin: 25px 0;
}

.section h3 {
  color: #888;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

button, select {
  font: inherit;
}

.control {
  width: 100%;
  padding: 13px;
  margin: 5px 0;
  border-radius: 10px;
  border: 1px solid #333;
  background: #1b1b1b;
  color: white;
  cursor: pointer;
}

.control:hover {
  background: #292929;
}

select.control {
  cursor: pointer;
}

.color-options {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.color {
  height: 38px;
  border: 2px solid #555;
  border-radius: 9px;
  cursor: pointer;
}

.color.selected {
  outline: 2px solid white;
  outline-offset: 2px;
}

.status {
  color: #777;
  font-size: 12px;
  margin-top: 25px;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="stage">
  <div class="eyes">
    <div class="eye"></div>
    <div class="eye"></div>
  </div>

  <div class="caption" id="caption">*chirp*</div>
</div>

<button class="menu-button" id="menuButton">☰</button>

<div class="backdrop" id="backdrop"></div>

<aside class="menu" id="menu">
  <div class="menu-header">
    <h2>MICRO DUCK</h2>
    <button class="close" id="closeButton">×</button>
  </div>

  <div class="section">
    <h3>Sounds</h3>

    <select class="control" id="voice">
      <option value="random">Random voice</option>
      <option value="duck1">Duck 1</option>
      <option value="duck2">Duck 2</option>
      <option value="duck3">Duck 3</option>
      <option value="duck4">Duck 4</option>
    </select>

    <button class="control" id="play">▶ Play random sound</button>
    <button class="control" id="auto">Start automatic sounds</button>
  </div>

  <div class="section">
    <h3>Eye colour</h3>

    <div class="color-options">
      <button class="color selected" style="background:#42baff"
        data-color="#42baff" title="Blue"></button>
      <button class="color" style="background:#00ff99"
        data-color="#00ff99" title="Green"></button>
      <button class="color" style="background:#ff4b83"
        data-color="#ff4b83" title="Pink"></button>
      <button class="color" style="background:#b56cff"
        data-color="#b56cff" title="Purple"></button>
      <button class="color" style="background:#fff"
        data-color="#ffffff" title="White"></button>
      <button class="color" style="background:#ffcc33"
        data-color="#ffcc33" title="Yellow"></button>
      <button class="color" style="background:#ff5533"
        data-color="#ff5533" title="Orange"></button>
      <button class="color" style="background:#ff3333"
        data-color="#ff3333" title="Red"></button>
    </div>
  </div>

  <div class="section">
    <h3>Display</h3>
    <button class="control" id="blinkButton">Toggle eye blinking</button>
    <button class="control" id="captionButton">Toggle captions</button>
  </div>

  <div class="status" id="status">
    ONLINE · Micro Duck is waiting.
  </div>
</aside>

<script>
const base =
"https://huggingface.co/spaces/pollen-robotics/microduck-simulator/resolve/main/app/public/assets/voices/";

const banks = ["duck1", "duck2", "duck3", "duck4"];
const takes = "abcdefghijkl";

const audio = new Audio();
audio.volume = 0.8;

const caption = document.getElementById("caption");
const status = document.getElementById("status");
const menu = document.getElementById("menu");
const backdrop = document.getElementById("backdrop");

let automatic = false;
let blinking = true;
let captions = true;
let timer = null;
let captionTimer = null;

function openMenu() {
  menu.classList.add("open");
  backdrop.classList.add("open");
}

function closeMenu() {
  menu.classList.remove("open");
  backdrop.classList.remove("open");
}

document.getElementById("menuButton").onclick = openMenu;
document.getElementById("closeButton").onclick = closeMenu;
backdrop.onclick = closeMenu;

function randomItem(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function showCaption() {
  if (!captions) return;

  clearTimeout(captionTimer);
  caption.classList.remove("show");

  void caption.offsetWidth;
  caption.classList.add("show");

  captionTimer = setTimeout(() => {
    caption.classList.remove("show");
  }, 2200);
}

async function chirp() {
  const selection = document.getElementById("voice").value;
  const bank = selection === "random"
    ? randomItem(banks)
    : selection;

  const take = randomItem(takes.split(""));
  const filename = `chirp_${take}.wav`;

  audio.pause();
  audio.src = `${base}${bank}/${filename}`;
  audio.currentTime = 0;

  showCaption();
  status.textContent = `PLAYING · ${bank} · ${filename}`;

  try {
    await audio.play();
  } catch (error) {
    status.textContent = "Audio couldn't play. Check your connection.";
    console.error(error);
  }
}

function scheduleNext() {
  clearTimeout(timer);

  if (!automatic) return;

  timer = setTimeout(async () => {
    await chirp();
    scheduleNext();
  }, 2800 + Math.random() * 2500);
}

document.getElementById("play").onclick = chirp;

document.getElementById("auto").onclick = () => {
  automatic = !automatic;

  if (automatic) {
    document.getElementById("auto").textContent = "Stop automatic sounds";
    chirp();
    scheduleNext();
  } else {
    clearTimeout(timer);
    audio.pause();
    document.getElementById("auto").textContent = "Start automatic sounds";
    status.textContent = "ONLINE · Automatic sounds stopped";
  }
};

// Eye colour picker
document.querySelectorAll(".color").forEach(button => {
  button.onclick = () => {
    const color = button.dataset.color;

    document.querySelectorAll(".eye").forEach(eye => {
      eye.style.background = color;
      eye.style.boxShadow = `0 0 35px ${color}88`;
    });

    document.querySelectorAll(".color").forEach(b =>
      b.classList.remove("selected")
    );

    button.classList.add("selected");
  };
});

// Blinking
document.getElementById("blinkButton").onclick = () => {
  blinking = !blinking;

  document.querySelectorAll(".eye").forEach(eye => {
    eye.style.animation = blinking ? "" : "none";
  });
};

// Captions
document.getElementById("captionButton").onclick = () => {
  captions = !captions;

  if (!captions) {
    caption.classList.remove("show");
  }
};
</script>

</body>
</html>
