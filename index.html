<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micro Duck — Sound Test</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #080d18;
  color: white;
  font-family: system-ui, sans-serif;
}

.container {
  text-align: center;
  padding: 30px;
  width: min(100%, 420px);
}

h1 {
  font-size: 25px;
  letter-spacing: 3px;
  color: #66caff;
}

.face {
  width: 270px;
  height: 210px;
  margin: 35px auto 15px;
  border: 4px solid #174c77;
  border-radius: 35px;
  background: #101e31;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 38px;
  box-shadow: 0 0 35px #168bff33;
}

.eye {
  width: 48px;
  height: 85px;
  background: #42baff;
  border-radius: 5px;
  box-shadow: 0 0 22px #168bff99;
  animation: blink 5s infinite;
}

@keyframes blink {
  0%, 94%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(.12); }
}

.caption {
  height: 42px;
  font-size: 24px;
  color: #83d5ff;
  opacity: 0;
  transition: opacity .45s ease;
}

.caption.show { opacity: 1; }

button, select {
  border: 1px solid #287db7;
  border-radius: 12px;
  padding: 13px 18px;
  background: #123452;
  color: white;
  font-size: 15px;
  cursor: pointer;
  margin: 7px;
}

button:hover { background: #1b5685; }

.status {
  color: #7895ac;
  font-size: 12px;
  margin-top: 22px;
}
</style>
</head>

<body>
<div class="container">
  <h1>MICRO DUCK</h1>

  <div class="face">
    <div class="eye"></div>
    <div class="eye"></div>
  </div>

  <div class="caption" id="caption">*chirp*</div>

  <button id="play">▶ Make a sound</button>
  <button id="auto">Start automatic mode</button>

  <div>
    <select id="voice">
      <option value="duck1">Duck 1 — Classic</option>
      <option value="duck2">Duck 2 — Charcoal</option>
      <option value="duck3">Duck 3 — Purple</option>
      <option value="duck4">Duck 4 — Blue</option>
      <option value="random">Random voice</option>
    </select>
  </div>

  <div class="status" id="status">READY · Waiting for interaction</div>
</div>

<script>
const base =
  "https://huggingface.co/spaces/pollen-robotics/microduck-simulator/resolve/main/app/public/assets/voices/";

const takes = "abcdefghijkl";
const banks = ["duck1", "duck2", "duck3", "duck4"];

const audio = new Audio();
audio.volume = 0.8;

const caption = document.getElementById("caption");
const statusText = document.getElementById("status");
const autoButton = document.getElementById("auto");

let automatic = false;
let timer = null;

function randomItem(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function showCaption() {
  caption.classList.remove("show");
  void caption.offsetWidth;
  caption.classList.add("show");

  setTimeout(() => caption.classList.remove("show"), 2200);
}

async function chirp() {
  const selected = document.getElementById("voice").value;
  const bank = selected === "random" ? randomItem(banks) : selected;
  const take = randomItem(takes.split(""));

  const url = `${base}${bank}/chirp_${take}.wav`;

  audio.pause();
  audio.src = url;
  audio.currentTime = 0;

  showCaption();
  statusText.textContent = `PLAYING · ${bank} · chirp_${take}.wav`;

  try {
    await audio.play();
  } catch (error) {
    statusText.textContent =
      "Couldn't play audio. Check your internet connection or try again.";
    console.error(error);
  }
}

function scheduleNext() {
  clearTimeout(timer);
  if (!automatic) return;

  timer = setTimeout(async () => {
    await chirp();
    scheduleNext();
  }, 2800 + Math.random() * 2500);
}

document.getElementById("play").addEventListener("click", chirp);

autoButton.addEventListener("click", async () => {
  automatic = !automatic;

  if (automatic) {
    autoButton.textContent = "Stop automatic mode";
    await chirp();
    scheduleNext();
  } else {
    clearTimeout(timer);
    audio.pause();
    autoButton.textContent = "Start automatic mode";
    statusText.textContent = "READY · Automatic mode stopped";
  }
});

audio.addEventListener("ended", () => {
  if (automatic) scheduleNext();
});
</script>
</body>
</html>
